<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCU watch order</title>
<style>
body{margin:0;background:#0c1424;color:#eef2f9;font:16px/1.5 Georgia,serif}
main{max-width:960px;margin:auto;padding:24px 14px 60px}
h1{text-align:center;font-size:34px;margin:0 0 4px}
.sub{text-align:center;color:#95a3bd;font-style:italic;margin:0 0 16px}
#c{text-align:center}
.bar{height:6px;background:#22304a;border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:#ff5a5f}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.ctl button{background:#142038;color:#eef2f9;border:1px solid #ff5a5f;border-radius:4px;padding:7px 12px;font:14px Georgia,serif}
.ctl button.on{background:#e23636}
.ctl button:disabled{opacity:.35}
h2{text-align:center;margin:28px 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.p{position:relative;aspect-ratio:2/3;border:0;border-radius:3px;color:#f4f6fb;padding:14px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;font-family:Georgia,serif;cursor:pointer;background:linear-gradient(165deg,var(--a),var(--b));outline:1px solid var(--e);outline-offset:-7px}
.p b{font-size:var(--f,18px);line-height:1.15}
.p small{font-size:12px}
.p.d::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,6,.7);font-size:44px;color:#ff5a5f}
</style></head><body><main>
<h1>The Marvel Cinematic Universe</h1>
<p class="sub">Every film and series, in release order. Tap a poster to mark it watched.</p>
<div id="c"></div><div class="bar"><i id="f"></i></div>
<div class="ctl" id="k"></div><div class="ctl" id="ph"></div>
<div id="l"></div>
</main><script>
const R=`1m2008-05 Iron Man
1m2008-06 The Incredible Hulk
1m2010-05 Iron Man 2
1m2011-05 Thor
1m2011-07 Captain America: The First Avenger
1m2012-05 The Avengers
2m2013-05 Iron Man 3
2m2013-11 Thor: The Dark World
2m2014-04 Captain America: The Winter Soldier
2m2014-08 Guardians of the Galaxy
2m2015-05 Avengers: Age of Ultron
2m2015-07 Ant-Man
3m2016-05 Captain America: Civil War
3m2016-11 Doctor Strange
3m2017-05 Guardians of the Galaxy Vol. 2
3m2017-07 Spider-Man: Homecoming
3m2017-11 Thor: Ragnarok
3m2018-02 Black Panther
3m2018-04 Avengers: Infinity War
3m2018-07 Ant-Man and the Wasp
3m2019-03 Captain Marvel
3m2019-04 Avengers: Endgame
3m2019-07 Spider-Man: Far From Home
4s2021-01 WandaVision
4s2021-03 The Falcon and the Winter Soldier
4s2021-06 Loki (S1)
4m2021-07 Black Widow
4s2021-08 What If...? (S1)
4m2021-09 Shang-Chi and the Legend of the Ten Rings
4m2021-11 Eternals
4s2021-11 Hawkeye
4m2021-12 Spider-Man: No Way Home
4s2022-03 Moon Knight
4m2022-05 Doctor Strange in the Multiverse of Madness
4s2022-06 Ms. Marvel
4m2022-07 Thor: Love and Thunder
4s2022-08 She-Hulk: Attorney at Law
4m2022-10 Werewolf by Night
4m2022-11 Black Panther: Wakanda Forever
4s2022-11 The Guardians of the Galaxy Holiday Special
5m2023-02 Ant-Man and the Wasp: Quantumania
5m2023-05 Guardians of the Galaxy Vol. 3
5s2023-06 Secret Invasion
5s2023-10 Loki (S2)
5m2023-11 The Marvels
5s2023-12 What If...? (S2)
5s2024-01 Echo
5s2024-03 X-Men ’97 (S1)
5m2024-07 Deadpool & Wolverine
5s2024-09 Agatha All Along
5s2024-12 What If...? (S3)
5s2025-01 Your Friendly Neighborhood Spider-Man
6m2025-02 Captain America: Brave New World
6s2025-03 Daredevil: Born Again (S1)
6m2025-05 Thunderbolts*
6s2025-06 Ironheart
6m2025-07 The Fantastic Four: First Steps
6s2025-08 Eyes of Wakanda
6s2025-09 Marvel Zombies
6s2026-01 Wonder Man
6s2026-03 Daredevil: Born Again (S2)
6s2026-05 The Punisher: One Last Kill
6s2026-07 X-Men ’97 (S2)
6m2026-07 Spider-Man: Brand New Day
6s2026-10 VisionQuest
6m2026-12 Avengers: Doomsday
6s2027-01 Your Friendly Neighborhood Spider-Man (S2)
6s2027-03 Daredevil: Born Again (S3)
6m2027-12 Avengers: Secret Wars`.split("\n").map((s,i)=>({id:i,p:+s[0],k:s[1]=="m"?"Film":"Series",r:s.slice(2,9),t:s.slice(10)}));
const M="Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
let kind="All",ph=0,seen=new Set();
const $=i=>document.getElementById(i);
const hue=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const ok=e=>kind=="All"||e.k==kind;
function draw(){
 const n=[0];
 for(let p=1;p<=6;p++)n[p]=R.filter(e=>ok(e)&&e.p==p).length;
 if(ph&&!n[ph])ph=0;
 $("k").innerHTML=["All","Film","Series"].map(k=>`<button data-k="${k}" class="${k==kind?"on":""}">${k=="Film"?"Movies":k}</button>`).join("");
 $("ph").innerHTML=`<button data-p="0" class="${ph?"":"on"}">All phases</button>`+[1,2,3,4,5,6].map(p=>`<button data-p="${p}" class="${ph==p?"on":""}"${n[p]?"":" disabled"}>Phase ${p}</button>`).join("");
 let h="";
 for(let p=1;p<=6;p++){
  if(ph&&ph!=p)continue;
  const g=R.filter(e=>ok(e)&&e.p==p);
  if(!g.length)continue;
  h+=`<h2>Phase ${p}</h2><div class="g">`;
  for(const e of g){
   const x=hue(e.t),L=e.t.length;
   h+=`<button class="p${seen.has(e.id)?" d":""}" data-i="${e.id}" style="--a:hsl(${x},42%,24%);--b:hsl(${(x+35)%360},48%,10%);--e:${e.k=="Film"?"#ff5a5f":"#7fd1ff"};--f:${L>38?14:L>24?16:L>14?18:22}px"><small>${e.k} ${e.id+1}</small><b>${e.t}</b><small>${M[+e.r.slice(5)-1]} ${e.r.slice(0,4)}</small></button>`;
  }
  h+="</div>";
 }
 $("l").innerHTML=h;
 $("c").textContent=seen.size+" of "+R.length+" watched";
 $("f").style.width=seen.size/R.length*100+"%";
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.k)kind=b.dataset.k;
 else if(b.dataset.p!==undefined)ph=+b.dataset.p;
 else if(b.dataset.i){const i=+b.dataset.i;seen.has(i)?seen.delete(i):seen.add(i)}
 draw();
});
draw();
</script></body></html>
